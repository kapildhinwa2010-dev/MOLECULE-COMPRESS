name: Ternary PTQ experiment

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU torch and transformers
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers
      - name: Run Experiment A (PTQ collapse)
        run: |
          set -o pipefail
          mkdir -p ci_logs results
          python ternary_ptq.py --model Qwen/Qwen2.5-0.5B --out results/ptq_report.json 2>&1 | tee ci_logs/experiment.log
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/ ci_logs/experiment.log
          git commit -m "experiment: ternary PTQ collapse run on Qwen2.5-0.5B [skip ci]" || echo "nothing to commit"
          git pull --rebase origin main || true
          git push || echo "push skipped"
