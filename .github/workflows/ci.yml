name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install CPU torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install project and test deps
        run: pip install -e . pytest
      - name: Run tests
        run: |
          set -o pipefail
          mkdir -p ci_logs
          python -m pytest tests/ -v 2>&1 | tee ci_logs/pytest.log
      - name: Upload CI log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log
          path: ci_logs/pytest.log
          if-no-files-found: warn
          retention-days: 14
